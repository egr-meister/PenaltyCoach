name: Android Release Build

# Fast, stable APK/AAB build + signing verification.
# No emulator smoke-tests here (kept off free runners on purpose).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Signing material comes ONLY from GitHub Secrets. Missing values simply
      # produce an unsigned build (CI still succeeds) rather than failing.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Optional API token. If absent, the app falls back to demo match data.
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 35 and Build Tools 35.0.0
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "FOOTBALL_API_BASE_URL=https://api.football-data.org/v4"
            if [ -n "$FOOTBALL_DATA_API_TOKEN" ]; then
              echo "FOOTBALL_DATA_API_TOKEN=$FOOTBALL_DATA_API_TOKEN"
            else
              echo "FOOTBALL_DATA_API_TOKEN=your_api_token_here"
            fi
          } > local.properties
          echo "local.properties created (token value is not printed)."

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found to verify." >&2
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Verifying: $APK"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          # Fail the build if the release artifact was signed with the debug key.
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release APK is signed with the debug certificate (CN=Android Debug)." >&2
            exit 1
          fi
          echo "Signature check passed (not a debug certificate)."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: penaltycoach-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB (Google Play upload target)
        uses: actions/upload-artifact@v4
        with:
          name: penaltycoach-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
